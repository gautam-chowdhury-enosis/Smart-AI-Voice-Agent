# Shared TLS parameters. Included by every 443 server block in tls.conf.
# TLS 1.0/1.1 are removed because browsers refuse them and they are unsuitable
# for microphone-bearing sessions.

ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers HIGH:!aNULL:!MD5;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
