# Shared response headers for the TLS reverse proxy.
#
# nginx does not inherit add_header directives into a location that declares any
# add_header of its own, so this file must be included in every location block
# (or at server level in a block whose locations add no headers) instead of
# being declared once at the top.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
